# Exploration specification — fixture for the operation in DESIGN.md §17.
# Same content as the worked example; standalone so a test can load it directly.
operation: 2026-10-scala-2-upgrade
scope:
  owners: [acme]
  exclude_repos: [acme/dotfiles]
  visibility: public               # this fixture is public-only; private operations are supported
criteria:                          # all must hold; metadata AND content allowed
  metadata:
    private: false
    languages: [Scala]
    archived: false
    fork: false
    pushed_after: 2025-01-01
  content:
    - id: scala_version
      match: any
      file: build.sbt
      extract: regex
      pattern: 'scalaVersion\s*:=\s*"([^"]+)"'
      in: ["2.13.12"]              # only services still on the old version
partition:
  strategy: by_owner               # one partition; the org is small
  max_partitions: 1
llm_use:
  annotate_only: true              # the LLM records evidence; it never promotes
  model: cheap-classifier
qualification:
  validator: deterministic
